# Personal workbench v1-lite. tmux >=3.3. Prefix C-b.
set -g prefix C-b
set -g prefix2 None
# Clear prefix bindings, including previous full-edition group entrances.
unbind-key -a -T prefix
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 20
set -g focus-events on
set -g set-clipboard external
set -g default-terminal tmux-256color
# RGB for common truecolor desktop terminals. Other terminal types keep terminfo.
set -s terminal-features[10] 'xterm*:RGB'
set -s terminal-features[11] 'alacritty*:RGB'
set -s terminal-features[12] 'foot*:RGB'
set -s terminal-features[13] 'wezterm*:RGB'
set -g window-style 'default'
set -g window-active-style 'default'
set -g pane-border-style 'fg=#43536b'
set -g pane-active-border-style 'fg=#82aadd'
set -g status-style 'fg=#d7deea,bg=#202b3e'
set -g message-style 'fg=#111827,bg=#8db5e8'
set -g mode-style 'fg=#d7deea,bg=#3b526e'
set -g status-left '#[bold] TMUX #S #[default] '
set -g status-right ' C-b h: help | %H:%M '
set -g status-left-length 30
set -g status-right-length 45
setw -g window-status-current-style 'fg=#111827,bg=#8db5e8,bold'
setw -g mode-keys vi
set -g update-environment 'DISPLAY WAYLAND_DISPLAY XAUTHORITY SSH_AUTH_SOCK SSH_CONNECTION'
# Clipboard writer runs in this shell only; no global PATH modification.
set -s copy-command 'PATH="$HOME/.local/bin:$PATH"; export PATH; if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy >/dev/null 2>&1; elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in >/dev/null 2>&1; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; else cat >/dev/null; tmux display-message "No desktop clipboard tool; tmux buffer retained (OSC52 if supported)"; fi'

# Explicitly replace all old root mouse overrides. Native mouse applications
# (including Vim) receive clicks/drags/releases; history uses tmux copy mode.
unbind-key -q -T root MouseDragEnd1Pane
unbind-key -q -T root MouseUp1Pane
bind-key -n MouseDown1Pane select-pane -t = \; send-keys -M
bind-key -n MouseDrag1Pane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -M }
bind-key -n MouseDragEnd1Pane if-shell -F '#{mouse_any_flag}' { send-keys -M }
bind-key -n MouseUp1Pane if-shell -F '#{mouse_any_flag}' { send-keys -M }
bind-key -n WheelUpPane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -e }
bind-key -n WheelDownPane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { select-pane -t = }
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe
bind-key -T copy-mode WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 5 scroll-down
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down
bind-key -T copy-mode-vi q send-keys -X cancel
bind-key -T copy-mode q send-keys -X cancel
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe


# One key = one action.
bind-key v split-window -h -c '#{pane_current_path}'
bind-key s split-window -v -c '#{pane_current_path}'
bind-key Left select-pane -L
bind-key Down select-pane -D
bind-key Up select-pane -U
bind-key Right select-pane -R
bind-key z resize-pane -Z
bind-key q confirm-before -p 'Close pane #P and its process? (y/n)' kill-pane
bind-key h display-menu -T 'TMUX · Ctrl-b + one key' 'v  Split left/right' '' '' 's  Split top/bottom' '' '' 'Arrows  Switch pane' '' '' 'z  Zoom/restore' '' '' 'q  Close pane (confirm)' '' '' 'Mouse drag: copy | copy mode q: return' '' '' 'Esc: close help' '' ''
# Do not terminate panes or alter their processes during reload.
